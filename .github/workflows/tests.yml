name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r scanners/requirements.txt pytest
      - name: Backend tests (permission gate, plan review, stop, comparison, report formats, quality checks)
        run: cd backend && python -m pytest -q
      - name: Scanner tests (parsers, target care, stop)
        run: cd scanners && python -m pytest -q
      - name: Flow files match the agent code
        run: python -m pytest -q langflow/tests
      - name: Web page scripts parse
        run: for file in frontend/public/js/*.js frontend/public/js/views/*.js; do node --check "$file"; done
      - name: Compose file is valid
        run: docker compose config --quiet
