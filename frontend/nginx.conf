# The only door into the system from your browser.
#   /            the web page (files from public/)
#   /api/...     passed on to the backend
#   /docs        the backend's API documentation
#   /internal/   NOT passed on: those endpoints are for the agents and the scanner service only

server {
    listen 8000;
    server_name _;

    # Look the backend up through Docker's own name service, at request time.
    # That way this container starts even when the backend is still starting.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;

        # Always ask the server whether a file changed, so an update shows up at once.
        add_header Cache-Control "no-cache" always;
        # Reports contain text that came from scanned websites. The browser is told to run
        # no script and load nothing that does not come from this page itself.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /internal/ {
        return 404;
    }
}
