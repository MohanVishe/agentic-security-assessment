name: agentic-security-assessment

# One command brings up everything:  docker compose up --build
#   UI        http://localhost:8501   (Streamlit)
#   API       http://localhost:8000/docs
#   Langflow  http://localhost:7860   (the agent flow, editable)
#   Target    http://localhost:3001   (OWASP Juice Shop; scan it as http://juice-shop:3000)
# Published ports bind to 127.0.0.1 only. ZAP and the scanner service are not published at all.

x-llm-env: &llm-env
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
  LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
  LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
  LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}

services:
  # --- the default demo target: deliberately vulnerable, yours to scan
  juice-shop:
    image: bkimminich/juice-shop:latest
    ports:
      - "127.0.0.1:${JUICE_SHOP_PORT:-3001}:3000"
    restart: unless-stopped

  # --- scanners
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    # JVM heap and container memory are capped: the AJAX spider's headless browser is hungry.
    command: >
      zap.sh -Xmx1g -daemon -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    mem_limit: 3g
    shm_size: 1g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  scanners:
    build: ./scanners
    environment:
      BACKEND_URL: http://backend:8000
      ZAP_URL: http://zap:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
    volumes:
      - scan-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zap
    restart: unless-stopped

  # --- agents
  langflow:
    image: langflowai/langflow:1.12.5
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      <<: *llm-env
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_API_KEY_SOURCE: env
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY:-change-me-langflow-key}
      LANGFLOW_LOAD_FLOWS_PATH: /app/flows
      LANGFLOW_COMPONENTS_PATH: /app/custom_components
      LANGFLOW_WORKER_TIMEOUT: "3600"
      DO_NOT_TRACK: "true"
      PYTHONPATH: /app/agentlib
      BACKEND_URL: http://backend:8000
      SCANNERS_URL: http://scanners:8001
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
    volumes:
      - ./langflow/flows:/app/flows:ro
      - ./langflow/components:/app/custom_components:ro
      - ./langflow/agentlib:/app/agentlib:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the agents reach a local Ollama
    restart: unless-stopped

  # --- app
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LANGFLOW_URL: http://langflow:7860
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY:-change-me-langflow-key}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
    volumes:
      - scan-data:/data
    depends_on:
      - langflow
      - scanners
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  scan-data:
