name: agentic-security-assessment

# One command brings up everything:  docker compose up -d --build
#   Web page  http://localhost:8000        (start a check, read the report)
#   API docs  http://localhost:8000/docs
#   Langflow  http://localhost:7860        (the three agents on a canvas, editable)
#   Target    http://localhost:3001        (the practice shop; see targets/juice-shop/)
#
# The parts, each in its own folder and its own container:
#   frontend/   the web page, and the only door in from your browser
#   backend/    the API, the database and the permission gate
#   langflow/   the three agents
#   scanners/   the four scanner tools (plus the zap container)
#   targets/    practice websites to check; not part of the product
#
# Published ports bind to 127.0.0.1 only. The backend, ZAP and the scanner service are not published at all.

# The practice target lives in its own folder. Remove these two lines to run without it.
include:
  - targets/juice-shop/docker-compose.yml

x-llm-env: &llm-env
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
  LLM_MODEL_PLANNER: ${LLM_MODEL_PLANNER:-}
  LLM_MODEL_EXECUTOR: ${LLM_MODEL_EXECUTOR:-}
  LLM_MODEL_REPORTER: ${LLM_MODEL_REPORTER:-}
  LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
  LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
  LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}

# Optional tracing. Leave the keys empty and nothing is sent anywhere.
x-langfuse-env: &langfuse-env
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}

services:
  # --- scanners
  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    # JVM heap and container memory are capped: the AJAX spider's headless browser is hungry.
    command: >
      zap.sh -Xmx1g -daemon -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    mem_limit: 3g
    shm_size: 1g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  scanners:
    build: ./scanners
    environment:
      BACKEND_URL: http://backend:8000
      ZAP_URL: http://zap:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
    volumes:
      - scan-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zap
    restart: unless-stopped

  # --- agents
  langflow:
    image: langflowai/langflow:1.12.5
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      <<: [*llm-env, *langfuse-env]
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_API_KEY_SOURCE: env
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY:-change-me-langflow-key}
      LANGFLOW_LOAD_FLOWS_PATH: /app/flows
      LANGFLOW_COMPONENTS_PATH: /app/custom_components
      LANGFLOW_WORKER_TIMEOUT: "3600"
      DO_NOT_TRACK: "true"
      PYTHONPATH: /app/agentlib
      BACKEND_URL: http://backend:8000
      SCANNERS_URL: http://scanners:8001
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
    volumes:
      - ./langflow/flows:/app/flows:ro
      - ./langflow/components:/app/custom_components:ro
      - ./langflow/agentlib:/app/agentlib:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the agents reach a local Ollama or Langfuse
    restart: unless-stopped

  # --- API (reached through the frontend; not published on its own)
  backend:
    build: ./backend
    environment:
      <<: *langfuse-env
      LANGFLOW_URL: http://langflow:7860
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY:-change-me-langflow-key}
      SCANNERS_URL: http://scanners:8001
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
      TARGETS_DIR: /srv/targets
      # The page shows which model is in use and whether a key is set. The key itself is not passed in.
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_KEY_SET: ${LLM_API_KEY:+yes}
    volumes:
      - scan-data:/data
      - ./targets:/srv/targets:ro   # the practice targets offered on the page
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - langflow
      - scanners
    restart: unless-stopped

  # --- web page
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  scan-data:
